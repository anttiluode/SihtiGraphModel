name: Spectral instrument checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  numpy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light dependencies
        run: python -m pip install "numpy>=1.24"
      - name: Unit tests (Torch-specific checks skip if unavailable)
        run: python -m unittest discover -s tests -v
      - name: Synthetic query-only spectral recovery
        run: python run.py --mode smoke
      - name: v2 distributed-additive synthetic gate
        run: python run_v2.py --mode synthetic
